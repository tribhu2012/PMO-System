[theme]
base = "light"
primaryColor = "#1f3a5c"
backgroundColor = "#f3f4f6"
secondaryBackgroundColor = "#eef0f3"
textColor = "#15191f"
borderColor = "#dfe2e7"
showWidgetBorder = true
baseRadius = "0.3rem"
buttonRadius = "0.3rem"
font = "Public Sans:https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap"
headingFont = "Source Serif 4:https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap"
baseFontSize = 14
dataframeHeaderBackgroundColor = "#f6f7f9"
dataframeBorderColor = "#eceef1"
chartCategoricalColors = ["#1f3a5c", "#c06a2b", "#3b8075", "#8a9bb4", "#8c5a86", "#7a8a3a", "#c9a24f", "#a3473b"]
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#fbfbfc"
secondaryBackgroundColor = "#f0f2f5"
textColor = "#4a505b"
borderColor = "#dfe2e7"

[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
